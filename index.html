<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VitaTrack - Daily Supplement Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font - Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              accent: '#6366f1'
            },
            dark: {
              bg: '#0f172a',
              card: '#1e293b',
              surface: '#334155',
              border: '#475569'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar for sleek dark look */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    /* Touch target optimizations */
    .touch-target {
      min-height: 48px;
    }
    /* Android Status Bar styling simulation */
    body {
      background-color: #020617;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .modal-enter {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="font-sans text-slate-100 flex justify-center items-center min-h-screen p-0 sm:p-4 overflow-x-hidden">

  <!-- Mobile Frame Container -->
  <div class="w-full max-w-md h-screen sm:h-[844px] bg-slate-900 sm:rounded-[40px] shadow-2xl flex flex-col relative overflow-hidden border-0 sm:border-[8px] border-slate-800">

    <!-- Android Simulated Status Bar -->
    <div class="pt-2 px-6 pb-1 flex justify-between items-center text-xs text-slate-400 select-none z-20 bg-slate-900/80 backdrop-blur-md">
      <span id="android-clock" class="font-semibold">12:00</span>
      <div class="flex items-center space-x-2">
        <i class="fa-solid font-bold fa-wifi"></i>
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-battery-full text-emerald-400"></i>
      </div>
    </div>

    <!-- Top App Bar / Header -->
    <header class="px-5 py-3 flex justify-between items-center z-10">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          <i class="fa-solid fa-capsules text-emerald-400"></i> VitaTrack
        </h1>
        <p id="current-date-text" class="text-xs text-slate-400 font-medium">Loading date...</p>
      </div>
      <button onclick="openModal()" class="w-10 h-10 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
        <i class="fa-solid fa-plus text-lg"></i>
      </button>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 overflow-y-auto px-4 py-2 space-y-4 pb-20">

      <!-- Progress Card -->
      <div class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/60 shadow-md">
        <div class="flex justify-between items-center mb-3">
          <div>
            <span class="text-xs uppercase tracking-wider font-semibold text-emerald-400">Daily Intake</span>
            <h2 id="progress-status-text" class="text-lg font-bold text-white">0% Completed</h2>
          </div>
          <!-- Streak Badge -->
          <div class="flex items-center gap-1.5 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-full text-amber-400">
            <i class="fa-solid fa-fire text-amber-400 animate-pulse"></i>
            <span id="streak-counter" class="text-xs font-bold">0 Day Streak</span>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-700/60 rounded-full h-3 overflow-hidden p-0.5 border border-slate-600/40">
          <div id="progress-bar-fill" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <!-- Filter / Timing Tabs -->
      <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar text-xs">
        <button onclick="filterSupplements('all')" id="tab-all" class="tab-btn px-4 py-2 rounded-full font-medium bg-emerald-500 text-slate-950 shadow-sm">All</button>
        <button onclick="filterSupplements('Morning')" id="tab-Morning" class="tab-btn px-4 py-2 rounded-full font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Morning</button>
        <button onclick="filterSupplements('Post-Workout')" id="tab-Post-Workout" class="tab-btn px-4 py-2 rounded-full font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Post-Workout</button>
        <button onclick="filterSupplements('Night')" id="tab-Night" class="tab-btn px-4 py-2 rounded-full font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Night</button>
      </div>

      <!-- Supplements Checklist Container -->
      <div class="space-y-3">
        <div class="flex justify-between items-center px-1">
          <h3 class="text-xs font-semibold uppercase text-slate-400 tracking-wider">Today's Schedule</h3>
          <button onclick="resetDailyCheck()" class="text-xs text-slate-400 hover:text-emerald-400 transition-colors flex items-center gap-1">
            <i class="fa-solid fa-rotate-right"></i> Reset Today
          </button>
        </div>

        <div id="supplement-list" class="space-y-2.5">
          <!-- Dynamic supplement items loaded here -->
        </div>
      </div>
    </main>

    <!-- Bottom Navigation Bar (Android style) -->
    <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 flex justify-around items-center py-2 px-6 z-20">
      <button class="flex flex-col items-center gap-1 text-emerald-400">
        <i class="fa-solid fa-calendar-check text-lg"></i>
        <span class="text-[10px] font-medium">Tracker</span>
      </button>
      <button onclick="showAnalytics()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-chart-simple text-lg"></i>
        <span class="text-[10px] font-medium">Stats</span>
      </button>
      <button onclick="clearAllData()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-rose-400">
        <i class="fa-solid fa-trash-can text-lg"></i>
        <span class="text-[10px] font-medium">Reset Data</span>
      </button>
    </nav>

  </div>

  <!-- Modal for Adding / Editing Supplement -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-container" class="w-full max-w-md bg-slate-900 rounded-t-3xl sm:rounded-2xl border border-slate-800 p-6 space-y-4 modal-enter shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 id="modal-title" class="text-lg font-bold text-white">Add Supplement</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <form id="supplement-form" onsubmit="saveSupplement(event)" class="space-y-3">
        <input type="hidden" id="supp-id">

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Supplement Name</label>
          <input type="text" id="supp-name" required placeholder="e.g. Creatine Monohydrate" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Dosage</label>
            <input type="text" id="supp-dosage" required placeholder="e.g. 5g, 1000mg" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Timing</label>
            <select id="supp-timing" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
              <option value="Morning">Morning</option>
              <option value="Post-Workout">Post-Workout</option>
              <option value="Night">Night</option>
              <option value="Anytime">Anytime</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Notes (Optional)</label>
          <input type="text" id="supp-notes" placeholder="e.g. Take with food or warm water" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>

        <div class="pt-2 flex gap-3">
          <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl text-sm transition-colors">Cancel</button>
          <button type="submit" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl text-sm shadow-lg shadow-emerald-500/20 transition-colors">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Message -->
  <div id="toast" class="fixed bottom-16 sm:bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-slate-100 px-4 py-2.5 rounded-full shadow-xl text-xs font-medium opacity-0 transition-opacity pointer-events-none z-50 flex items-center gap-2">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toast-msg">Notification message</span>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Initial Default Supplements Sample Data
    const DEFAULT_SUPPLEMENTS = [
      { id: '1', name: 'Creatine Monohydrate', dosage: '5g', timing: 'Post-Workout', notes: 'Mix with fruit juice for absorption', taken: false },
      { id: '2', name: 'Vitamin D3 & K2', dosage: '5000 IU', timing: 'Morning', notes: 'Take with fat-containing meal', taken: false },
      { id: '3', name: 'Magnesium Glycinate', dosage: '400mg', timing: 'Night', notes: 'Helps with sleep quality', taken: false },
      { id: '4', name: 'Omega-3 Fish Oil', dosage: '2000mg', timing: 'Morning', notes: 'High EPA/DHA ratio', taken: false }
    ];

    let supplements = [];
    let activeFilter = 'all';
    let streak = 0;
    let lastActiveDate = null;

    // Window load initialization
    window.onload = function () {
      updateClock();
      setInterval(updateClock, 1000);
      formatDateHeader();
      loadData();
      renderSupplements();
    };

    // Simulated Android Clock Update
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      document.getElementById('android-clock').innerText = timeStr;
    }

    // Date display header
    function formatDateHeader() {
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      const dateStr = new Date().toLocaleDateString('en-US', options);
      document.getElementById('current-date-text').innerText = dateStr;
    }

    // Storage Management
    function loadData() {
      const storedSupps = localStorage.getItem('vitatrack_supplements');
      const storedStreak = localStorage.getItem('vitatrack_streak');
      const storedDate = localStorage.getItem('vitatrack_last_date');

      const today = new Date().toDateString();

      if (storedSupps) {
        supplements = JSON.parse(storedSupps);
      } else {
        supplements = DEFAULT_SUPPLEMENTS;
        saveData();
      }

      // Check for day rollover to maintain streaks accurately
      if (storedDate && storedDate !== today) {
        // If missed more than 1 day, reset streak
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        if (storedDate !== yesterday.toDateString()) {
          streak = 0;
        }
        // Auto reset taken statuses for new day
        supplements.forEach(s => s.taken = false);
        saveData();
      } else if (storedStreak) {
        streak = parseInt(storedStreak, 10);
      }

      lastActiveDate = today;
      localStorage.setItem('vitatrack_last_date', today);
      updateStreakUI();
    }

    function saveData() {
      localStorage.setItem('vitatrack_supplements', JSON.stringify(supplements));
      localStorage.setItem('vitatrack_streak', streak.toString());
    }

    // Render Supplements List
    function renderSupplements() {
      const listContainer = document.getElementById('supplement-list');
      listContainer.innerHTML = '';

      const filtered = supplements.filter(item => {
        if (activeFilter === 'all') return true;
        return item.timing === activeFilter;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-8 text-slate-500">
            <i class="fa-solid fa-box-open text-3xl mb-2 block"></i>
            <p class="text-sm">No supplements found for this filter.</p>
          </div>
        `;
        updateProgress();
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `p-3.5 rounded-2xl border transition-all flex items-center justify-between gap-3 ${
          item.taken 
            ? 'bg-slate-900/40 border-slate-800/80 opacity-75' 
            : 'bg-slate-800/90 border-slate-700/80 hover:border-slate-600'
        }`;

        card.innerHTML = `
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <!-- Checkbox button -->
            <button onclick="toggleTake('${item.id}')" class="w-10 h-10 rounded-xl flex items-center justify-center transition-all ${
              item.taken 
                ? 'bg-emerald-500 text-slate-950 font-bold shadow-md shadow-emerald-500/20' 
                : 'bg-slate-700/60 border border-slate-600 text-transparent hover:border-emerald-500'
            }">
              <i class="fa-solid fa-check text-base"></i>
            </button>

            <!-- Details -->
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                <h4 class="text-sm font-semibold text-white truncate ${item.taken ? 'line-through text-slate-400' : ''}">${item.name}</h4>
                <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-700/80 text-emerald-400 font-medium">${item.dosage}</span>
              </div>
              <div class="flex items-center gap-2 mt-0.5 text-xs text-slate-400">
                <span class="flex items-center gap-1"><i class="fa-regular fa-clock text-[10px]"></i> ${item.timing}</span>
                ${item.notes ? `<span class="truncate border-l border-slate-700 pl-2 text-slate-400">${item.notes}</span>` : ''}
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div class="flex items-center gap-1">
            <button onclick="openModal('${item.id}')" class="p-2 text-slate-400 hover:text-white transition-colors">
              <i class="fa-solid fa-pen-to-square text-xs"></i>
            </button>
            <button onclick="deleteSupplement('${item.id}')" class="p-2 text-slate-400 hover:text-rose-400 transition-colors">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `;
        listContainer.appendChild(card);
      });

      updateProgress();
    }

    // Toggle Supplement completion state
    function toggleTake(id) {
      const item = supplements.find(s => s.id === id);
      if (item) {
        item.taken = !item.taken;
        
        // Show quick feedback toast
        if (item.taken) {
          showToast(`Taken: ${item.name}`);
        }

        saveData();
        renderSupplements();
        checkStreakProgress();
      }
    }

    // Update progress bar and percentages
    function updateProgress() {
      if (supplements.length === 0) {
        document.getElementById('progress-status-text').innerText = '0%';
        document.getElementById('progress-bar-fill').style.width = '0%';
        return;
      }

      const completed = supplements.filter(s => s.taken).length;
      const percentage = Math.round((completed / supplements.length) * 100);

      document.getElementById('progress-status-text').innerText = `${percentage}% Completed`;
      document.getElementById('progress-bar-fill').style.width = `${percentage}%`;
    }

    // Manage streaks
    function checkStreakProgress() {
      const allDone = supplements.length > 0 && supplements.every(s => s.taken);
      if (allDone) {
        streak += 1;
        showToast('🔥 Daily goal complete! Streak increased.');
      }
      updateStreakUI();
      saveData();
    }

    function updateStreakUI() {
      document.getElementById('streak-counter').innerText = `${streak} Day Streak`;
    }

    // Modal Control
    function openModal(id = null) {
      const modal = document.getElementById('modal-backdrop');
      const title = document.getElementById('modal-title');
      
      if (id) {
        const item = supplements.find(s => s.id === id);
        if (item) {
          document.getElementById('supp-id').value = item.id;
          document.getElementById('supp-name').value = item.name;
          document.getElementById('supp-dosage').value = item.dosage;
          document.getElementById('supp-timing').value = item.timing;
          document.getElementById('supp-notes').value = item.notes || '';
          title.innerText = 'Edit Supplement';
        }
      } else {
        document.getElementById('supplement-form').reset();
        document.getElementById('supp-id').value = '';
        title.innerText = 'Add Supplement';
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    // Save or update supplement item
    function saveSupplement(e) {
      e.preventDefault();

      const id = document.getElementById('supp-id').value;
      const name = document.getElementById('supp-name').value.trim();
      const dosage = document.getElementById('supp-dosage').value.trim();
      const timing = document.getElementById('supp-timing').value;
      const notes = document.getElementById('supp-notes').value.trim();

      if (id) {
        // Edit existing
        const item = supplements.find(s => s.id === id);
        if (item) {
          item.name = name;
          item.dosage = dosage;
          item.timing = timing;
          item.notes = notes;
          showToast('Supplement updated');
        }
      } else {
        // Create new
        const newSupp = {
          id: Date.now().toString(),
          name,
          dosage,
          timing,
          notes,
          taken: false
        };
        supplements.push(newSupp);
        showToast('New supplement added');
      }

      saveData();
      renderSupplements();
      closeModal();
    }

    // Delete supplement
    function deleteSupplement(id) {
      supplements = supplements.filter(s => s.id !== id);
      saveData();
      renderSupplements();
      showToast('Supplement removed');
    }

    // Filter Navigation
    function filterSupplements(timing) {
      activeFilter = timing;
      
      // Update UI active tab styles
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-4 py-2 rounded-full font-medium bg-slate-800 text-slate-300 hover:bg-slate-700';
      });

      const activeTab = document.getElementById(`tab-${timing}`);
      if (activeTab) {
        activeTab.className = 'tab-btn px-4 py-2 rounded-full font-medium bg-emerald-500 text-slate-950 shadow-sm';
      }

      renderSupplements();
    }

    // Reset daily check marks
    function resetDailyCheck() {
      supplements.forEach(s => s.taken = false);
      saveData();
      renderSupplements();
      showToast('Daily checklist reset');
    }

    // Clear all data back to clean state
    function clearAllData() {
      if (confirm('Are you sure you want to reset all data back to default?')) {
        localStorage.clear();
        supplements = DEFAULT_SUPPLEMENTS;
        streak = 0;
        saveData();
        renderSupplements();
        updateStreakUI();
        showToast('Data reset to default');
      }
    }

    // Stats popup mockup
    function showAnalytics() {
      const completedCount = supplements.filter(s => s.taken).length;
      alert(`📊 Supplement Insights:\n\n• Total Tracked: ${supplements.length}\n• Taken Today: ${completedCount}\n• Current Streak: ${streak} days`);
    }

    // Toast Notification Banner Helper
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');

      toastMsg.innerText = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
        toast.classList.remove('opacity-100');
      }, 2000);
    }
  </script>
</body>
</html>
