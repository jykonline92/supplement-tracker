<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VitaTrack - Daily Supplement Tracker</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font - Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#e8fef0',
              100: '#c7fce0',
              500: '#00e676',
              600: '#00c853',
              700: '#00a142',
              accent: '#ff9800'
            },
            dark: {
              bg: '#121212',
              card: '#1e1e1e',
              surface: '#2a2a2a',
              border: '#383838'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #121212;
    }
    ::-webkit-scrollbar-thumb {
      background: #383838;
      border-radius: 9999px;
    }

    body {
      background-color: #0a0a0a;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-enter {
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Days of week checkbox styling */
    .day-btn-checkbox:checked + label {
      background-color: #00e676;
      color: #000000;
      font-weight: 700;
      border-color: #00e676;
    }
  </style>
</head>
<body class="font-sans text-slate-100 flex justify-center items-center min-h-screen p-0 sm:p-4 overflow-x-hidden">

  <!-- Main Mobile Shell Container -->
  <div class="w-full max-w-md h-screen sm:h-[880px] bg-dark-bg sm:rounded-[40px] shadow-2xl flex flex-col relative overflow-hidden border-0 sm:border-[8px] border-slate-800">

    <!-- Android Simulated Top Status Bar -->
    <div class="pt-2 px-6 pb-1 flex justify-between items-center text-xs text-slate-400 select-none z-20 bg-dark-bg/90 backdrop-blur-md border-b border-dark-border/40">
      <span id="android-clock" class="font-semibold tracking-tight">12:00</span>
      <div class="flex items-center space-x-2 text-[11px]">
        <i class="fa-solid fa-bell-slash text-amber-500 hidden" id="notif-off-icon" title="Notifications disabled"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-battery-full text-brand-500"></i>
      </div>
    </div>

    <!-- Main Header Bar -->
    <header class="px-5 py-3 flex justify-between items-center z-10 bg-dark-card/50 border-b border-dark-border/50">
      <div>
        <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
          <i class="fa-solid fa-capsules text-brand-500"></i> VitaTrack
        </h1>
        <p id="current-date-text" class="text-xs text-slate-400 font-medium">Loading date...</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="requestNotificationPermission()" id="notif-toggle-btn" class="w-9 h-9 bg-dark-surface hover:bg-dark-border text-slate-300 rounded-full flex items-center justify-center transition-all border border-dark-border" title="Enable Reminders">
          <i class="fa-solid fa-bell text-sm" id="notif-bell-icon"></i>
        </button>
        <button onclick="openModal()" class="w-10 h-10 bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold rounded-full flex items-center justify-center shadow-lg shadow-brand-500/20 active:scale-95 transition-all">
          <i class="fa-solid fa-plus text-lg"></i>
        </button>
      </div>
    </header>

    <!-- Content View 1: Tracker Checklist Tab -->
    <main id="view-tracker" class="flex-1 overflow-y-auto px-4 py-3 space-y-4 pb-20">

      <!-- Today's Progress Card -->
      <div class="bg-dark-card rounded-2xl p-4 border border-dark-border shadow-md">
        <div class="flex justify-between items-center mb-2.5">
          <div>
            <span class="text-[11px] uppercase tracking-wider font-semibold text-brand-500">Scheduled Today</span>
            <h2 id="progress-status-text" class="text-lg font-extrabold text-white">0% Completed</h2>
          </div>
          <!-- Streak Pill Badge -->
          <div class="flex items-center gap-1.5 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-full text-amber-400">
            <i class="fa-solid fa-fire text-amber-400 animate-pulse"></i>
            <span id="streak-counter" class="text-xs font-bold">0 Day Streak</span>
          </div>
        </div>

        <!-- Dynamic Progress Bar -->
        <div class="w-full bg-dark-surface rounded-full h-3 overflow-hidden p-0.5 border border-dark-border">
          <div id="progress-bar-fill" class="bg-gradient-to-r from-brand-600 to-brand-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <!-- Time Filter Pills -->
      <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar text-xs">
        <button onclick="filterSupplements('all')" id="tab-all" class="tab-btn px-4 py-2 rounded-full font-medium bg-brand-500 text-slate-950 shadow-sm transition-all">All Scheduled</button>
        <button onclick="filterSupplements('Morning')" id="tab-Morning" class="tab-btn px-4 py-2 rounded-full font-medium bg-dark-card text-slate-300 border border-dark-border hover:bg-dark-surface transition-all">Morning</button>
        <button onclick="filterSupplements('Post-Workout')" id="tab-Post-Workout" class="tab-btn px-4 py-2 rounded-full font-medium bg-dark-card text-slate-300 border border-dark-border hover:bg-dark-surface transition-all">Post-Workout</button>
        <button onclick="filterSupplements('Night')" id="tab-Night" class="tab-btn px-4 py-2 rounded-full font-medium bg-dark-card text-slate-300 border border-dark-border hover:bg-dark-surface transition-all">Night</button>
      </div>

      <!-- Checklist Section -->
      <div class="space-y-3">
        <div class="flex justify-between items-center px-1">
          <h3 class="text-xs font-semibold uppercase text-slate-400 tracking-wider">Today's Protocol</h3>
          <button onclick="resetDailyCheck()" class="text-xs text-slate-400 hover:text-brand-500 transition-colors flex items-center gap-1">
            <i class="fa-solid fa-rotate-right"></i> Reset Today
          </button>
        </div>

        <div id="supplement-list" class="space-y-2.5">
          <!-- Dynamic Items Rendered Here -->
        </div>
      </div>
    </main>

    <!-- Content View 2: Stats & Monthly Calendar Tab -->
    <main id="view-stats" class="flex-1 overflow-y-auto px-4 py-3 space-y-4 pb-20 hidden">
      
      <!-- High Level Metrics Bar -->
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-dark-card p-3 rounded-2xl border border-dark-border">
          <span class="text-[10px] uppercase font-semibold text-slate-400 block mb-0.5">Overall</span>
          <span id="stat-compliance" class="text-lg font-black text-brand-500">100%</span>
        </div>
        <div class="bg-dark-card p-3 rounded-2xl border border-dark-border">
          <span class="text-[10px] uppercase font-semibold text-slate-400 block mb-0.5">Current</span>
          <span id="stat-streak" class="text-lg font-black text-amber-400">0 Days</span>
        </div>
        <div class="bg-dark-card p-3 rounded-2xl border border-dark-border">
          <span class="text-[10px] uppercase font-semibold text-slate-400 block mb-0.5">Total Taken</span>
          <span id="stat-total-taken" class="text-lg font-black text-slate-100">0</span>
        </div>
      </div>

      <!-- Interactive Monthly Calendar View -->
      <div class="bg-dark-card rounded-2xl p-4 border border-dark-border shadow-md">
        <!-- Calendar Month Header -->
        <div class="flex justify-between items-center mb-3">
          <button onclick="changeCalendarMonth(-1)" class="w-8 h-8 rounded-xl bg-dark-surface text-slate-300 hover:text-white flex items-center justify-center">
            <i class="fa-solid fa-chevron-left text-xs"></i>
          </button>
          <h3 id="calendar-month-year" class="text-sm font-bold text-white tracking-wide">October 2026</h3>
          <button onclick="changeCalendarMonth(1)" class="w-8 h-8 rounded-xl bg-dark-surface text-slate-300 hover:text-white flex items-center justify-center">
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
        </div>

        <!-- Days of Week Header -->
        <div class="grid grid-cols-7 text-center text-[10px] font-bold text-slate-500 uppercase mb-2">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>

        <!-- Calendar Days Grid -->
        <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 text-xs text-center">
          <!-- Calendar Days dynamically injected -->
        </div>

        <!-- Calendar Legend -->
        <div class="flex justify-center items-center gap-4 mt-4 text-[11px] text-slate-400 border-t border-dark-border/60 pt-3">
          <div class="flex items-center gap-1.5">
            <span class="w-3 h-3 rounded-full bg-brand-500 inline-block shadow-sm shadow-brand-500/50"></span>
            <span>100% Complete</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="w-3 h-3 rounded-full bg-amber-500 inline-block shadow-sm shadow-amber-500/50"></span>
            <span>Partial / Missed</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="w-3 h-3 rounded-full bg-dark-surface border border-dark-border inline-block"></span>
            <span>No Entry</span>
          </div>
        </div>
      </div>

      <!-- Schedule Breakdown List -->
      <div class="bg-dark-card rounded-2xl p-4 border border-dark-border space-y-2">
        <h3 class="text-xs font-semibold uppercase text-slate-400 tracking-wider">Active Schedules</h3>
        <div id="schedule-breakdown" class="space-y-2 text-xs divide-y divide-dark-border/50">
          <!-- Dynamic breakdown items -->
        </div>
      </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="absolute bottom-0 left-0 right-0 bg-dark-bg/95 backdrop-blur-lg border-t border-dark-border flex justify-around items-center py-2.5 px-6 z-20">
      <button onclick="switchTab('tracker')" id="nav-tracker" class="flex flex-col items-center gap-1 text-brand-500 font-semibold transition-all">
        <i class="fa-solid fa-calendar-check text-lg"></i>
        <span class="text-[10px]">Today</span>
      </button>
      <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition-all">
        <i class="fa-solid fa-chart-line text-lg"></i>
        <span class="text-[10px]">Stats & History</span>
      </button>
      <button onclick="clearAllData()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-rose-400 transition-all">
        <i class="fa-solid fa-trash-can text-lg"></i>
        <span class="text-[10px]">Reset App</span>
      </button>
    </nav>

  </div>

  <!-- Modal for Adding / Editing Supplement -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-container" class="w-full max-w-md bg-dark-card rounded-t-3xl sm:rounded-2xl border border-dark-border p-5 space-y-4 modal-enter shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-dark-border pb-3">
        <h3 id="modal-title" class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-pills text-brand-500"></i> Add Supplement
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="supplement-form" onsubmit="saveSupplement(event)" class="space-y-3 text-xs">
        <input type="hidden" id="supp-id">

        <div>
          <label class="block text-slate-400 mb-1 font-medium">Supplement Name</label>
          <input type="text" id="supp-name" required placeholder="e.g. Creatine Monohydrate" class="w-full bg-dark-surface border border-dark-border rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-brand-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-medium">Dosage</label>
            <input type="text" id="supp-dosage" required placeholder="e.g. 5g, 1000mg" class="w-full bg-dark-surface border border-dark-border rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-medium">Timing Window</label>
            <select id="supp-timing" class="w-full bg-dark-surface border border-dark-border rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-brand-500">
              <option value="Morning">Morning</option>
              <option value="Post-Workout">Post-Workout</option>
              <option value="Night">Night</option>
              <option value="Anytime">Anytime</option>
            </select>
          </div>
        </div>

        <!-- Frequency Picker -->
        <div>
          <label class="block text-slate-400 mb-1 font-medium">Frequency Schedule</label>
          <select id="supp-freq-type" onchange="toggleFrequencyOptions()" class="w-full bg-dark-surface border border-dark-border rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-brand-500">
            <option value="daily">Every Day</option>
            <option value="alternate">Alternate Days (Every 2nd Day)</option>
            <option value="custom">Specific Days of Week</option>
          </select>
        </div>

        <!-- Custom Days Selector Container (Hidden unless 'custom' is picked) -->
        <div id="custom-days-container" class="hidden bg-dark-surface/60 p-3 rounded-xl border border-dark-border space-y-1.5">
          <label class="block text-[11px] text-slate-300 font-medium mb-1">Select Days:</label>
          <div class="flex justify-between gap-1">
            <template id="day-checkbox-template">
              <div class="flex-1 text-center">
                <input type="checkbox" id="day-0" value="0" class="day-btn-checkbox hidden">
                <label for="day-0" class="block py-1.5 rounded-lg border border-dark-border text-[11px] text-slate-300 cursor-pointer text-center transition-all">Sun</label>
              </div>
            </template>
            <div id="days-selector-grid" class="flex justify-between w-full gap-1">
              <!-- Rendered dynamically -->
            </div>
          </div>
        </div>

        <!-- Reminder Time Field -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-medium">Reminder Time</label>
            <input type="time" id="supp-time" class="w-full bg-dark-surface border border-dark-border rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-medium">Alert Status</label>
            <div class="flex items-center h-[38px] px-2 bg-dark-surface border border-dark-border rounded-xl">
              <input type="checkbox" id="supp-notif-enabled" class="w-4 h-4 accent-brand-500 rounded">
              <label for="supp-notif-enabled" class="ml-2 text-slate-300 text-[11px]">Enable Alert</label>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1 font-medium">Notes (Optional)</label>
          <input type="text" id="supp-notes" placeholder="e.g. Take with food or water" class="w-full bg-dark-surface border border-dark-border rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-brand-500">
        </div>

        <div class="pt-2 flex gap-3">
          <button type="button" onclick="closeModal()" class="flex-1 bg-dark-surface hover:bg-dark-border text-slate-300 font-semibold py-2.5 rounded-xl transition-colors">Cancel</button>
          <button type="submit" class="flex-1 bg-brand-500 hover:bg-brand-600 text-slate-950 font-extrabold py-2.5 rounded-xl shadow-lg shadow-brand-500/20 transition-colors">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Notification Toast Banner -->
  <div id="toast" class="fixed bottom-16 sm:bottom-10 left-1/2 -translate-x-1/2 bg-dark-card border border-dark-border text-slate-100 px-4 py-2.5 rounded-full shadow-2xl text-xs font-medium opacity-0 transition-opacity pointer-events-none z-50 flex items-center gap-2">
    <i id="toast-icon" class="fa-solid fa-circle-check text-brand-500"></i>
    <span id="toast-msg">Notification message</span>
  </div>

  <!-- Application Logic -->
  <script>
    // Initial Seed Sample Data with standard supplement regimes
    const DEFAULT_SUPPLEMENTS = [
      {
        id: '1',
        name: 'Creatine Monohydrate',
        dosage: '5g',
        timing: 'Post-Workout',
        frequency: { type: 'daily' },
        time: '16:00',
        notifEnabled: true,
        notes: 'Take with water or protein shake',
        createdDate: '2026-10-01',
        taken: false
      },
      {
        id: '2',
        name: 'Vitamin D3 & K2',
        dosage: '5000 IU',
        timing: 'Morning',
        frequency: { type: 'daily' },
        time: '08:30',
        notifEnabled: true,
        notes: 'Take with breakfast (fat soluble)',
        createdDate: '2026-10-01',
        taken: false
      },
      {
        id: '3',
        name: 'Magnesium Glycinate',
        dosage: '400mg',
        timing: 'Night',
        frequency: { type: 'daily' },
        time: '21:30',
        notifEnabled: true,
        notes: 'Helps muscle recovery and sleep',
        createdDate: '2026-10-01',
        taken: false
      },
      {
        id: '4',
        name: 'Omega-3 Fish Oil',
        dosage: '2000mg',
        timing: 'Morning',
        frequency: { type: 'alternate' }, // Every 2 days
        time: '09:00',
        notifEnabled: false,
        notes: 'High EPA/DHA ratio',
        createdDate: '2026-10-01',
        taken: false
      }
    ];

    const DAYS_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    let supplements = [];
    let historyData = {}; // Format: { "YYYY-MM-DD": { scheduled: N, completed: N } }
    let activeFilter = 'all';
    let streak = 0;
    let calendarViewDate = new Date();

    // Initialize application state
    window.onload = function () {
      updateClock();
      setInterval(updateClock, 1000);
      formatDateHeader();
      buildCustomDaysSelector();
      loadData();
      renderSupplements();
      renderCalendar();
      initNotificationTimer();
      registerServiceWorker();
    };

    // Simulated Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('android-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function formatDateHeader() {
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('current-date-text').innerText = new Date().toLocaleDateString('en-US', options);
    }

    // Load state from localStorage
    function loadData() {
      const storedSupps = localStorage.getItem('vitatrack_supplements_v2');
      const storedHistory = localStorage.getItem('supplement_history_v1');
      const storedStreak = localStorage.getItem('vitatrack_streak');
      const storedLastDate = localStorage.getItem('vitatrack_last_date');

      const todayStr = getTodayISOString();

      if (storedSupps) {
        supplements = JSON.parse(storedSupps);
      } else {
        supplements = DEFAULT_SUPPLEMENTS;
        saveData();
      }

      if (storedHistory) {
        historyData = JSON.parse(storedHistory);
      }

      if (storedStreak) {
        streak = parseInt(storedStreak, 10);
      }

      // Check day rollover
      if (storedLastDate && storedLastDate !== todayStr) {
        // Save yesterday's completion state to history before resetting
        recordDayHistory(storedLastDate);
        
        // Check missed streak
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = getISOString(yesterday);

        if (storedLastDate !== yesterdayStr) {
          streak = 0; // Missed more than 1 day
        }

        // Reset today's checklist flags
        supplements.forEach(s => s.taken = false);
        saveData();
      }

      localStorage.setItem('vitatrack_last_date', todayStr);
      updateStreakUI();
    }

    function saveData() {
      localStorage.setItem('vitatrack_supplements_v2', JSON.stringify(supplements));
      localStorage.setItem('supplement_history_v1', JSON.stringify(historyData));
      localStorage.setItem('vitatrack_streak', streak.toString());
    }

    // Helper: ISO Date format YYYY-MM-DD
    function getISOString(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getTodayISOString() {
      return getISOString(new Date());
    }

    // Filter algorithm: Is supplement scheduled today?
    function isScheduledForDate(supp, dateObj) {
      const freq = supp.frequency || { type: 'daily' };

      if (freq.type === 'daily') {
        return true;
      }

      if (freq.type === 'alternate') {
        // Alternate days calculation based on created date or day-of-year parity
        const start = supp.createdDate ? new Date(supp.createdDate) : new Date('2026-01-01');
        const diffTime = Math.abs(dateObj - start);
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        return diffDays % 2 === 0;
      }

      if (freq.type === 'custom' && Array.isArray(freq.days)) {
        const dayOfWeek = dateObj.getDay(); // 0 = Sun, 1 = Mon ...
        return freq.days.includes(dayOfWeek);
      }

      return true;
    }

    // Render Checklist View
    function renderSupplements() {
      const listContainer = document.getElementById('supplement-list');
      listContainer.innerHTML = '';

      const todayObj = new Date();

      // Filter supplements scheduled for today
      const todayScheduled = supplements.filter(item => isScheduledForDate(item, todayObj));

      // Apply time timing category filter (Morning, Night, etc.)
      const filtered = todayScheduled.filter(item => {
        if (activeFilter === 'all') return true;
        return item.timing === activeFilter;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-10 text-slate-500 bg-dark-card/50 rounded-2xl border border-dark-border/40">
            <i class="fa-solid fa-calendar-day text-3xl mb-2 block text-slate-600"></i>
            <p class="text-xs">No supplements scheduled for this view today.</p>
          </div>
        `;
        updateProgress(todayScheduled);
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `p-3.5 rounded-2xl border transition-all flex items-center justify-between gap-3 ${
          item.taken 
            ? 'bg-dark-card/40 border-dark-border/40 opacity-70' 
            : 'bg-dark-card border-dark-border hover:border-slate-700'
        }`;

        card.innerHTML = `
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <!-- Toggle Checkbox Button -->
            <button onclick="toggleTake('${item.id}')" class="w-10 h-10 rounded-xl flex items-center justify-center transition-all ${
              item.taken 
                ? 'bg-brand-500 text-slate-950 font-bold shadow-md shadow-brand-500/20' 
                : 'bg-dark-surface border border-dark-border text-transparent hover:border-brand-500'
            }">
              <i class="fa-solid fa-check text-base"></i>
            </button>

            <!-- Text Details -->
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                <h4 class="text-xs font-bold text-white truncate ${item.taken ? 'line-through text-slate-400' : ''}">${item.name}</h4>
                <span class="text-[9px] px-2 py-0.5 rounded-full bg-dark-surface text-brand-500 font-semibold border border-dark-border">${item.dosage}</span>
              </div>
              <div class="flex items-center gap-2 mt-1 text-[11px] text-slate-400">
                <span class="flex items-center gap-1"><i class="fa-regular fa-clock text-[10px]"></i> ${item.timing} ${item.time ? `(${item.time})` : ''}</span>
                <span class="text-[10px] bg-dark-surface/60 px-1.5 py-0.2 rounded text-slate-400 capitalize">${formatFrequencyText(item.frequency)}</span>
              </div>
              ${item.notes ? `<p class="text-[10px] text-slate-400 mt-0.5 truncate">${item.notes}</p>` : ''}
            </div>
          </div>

          <!-- Actions -->
          <div class="flex items-center gap-1">
            <button onclick="openModal('${item.id}')" class="p-2 text-slate-400 hover:text-white transition-colors">
              <i class="fa-solid fa-pen-to-square text-xs"></i>
            </button>
            <button onclick="deleteSupplement('${item.id}')" class="p-2 text-slate-400 hover:text-rose-400 transition-colors">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `;
        listContainer.appendChild(card);
      });

      updateProgress(todayScheduled);
      recordDayHistory(getTodayISOString());
    }

    function formatFrequencyText(freq) {
      if (!freq) return 'Daily';
      if (freq.type === 'daily') return 'Daily';
      if (freq.type === 'alternate') return 'Alternate Days';
      if (freq.type === 'custom' && freq.days) {
        return freq.days.map(d => DAYS_SHORT[d]).join(', ');
      }
      return 'Scheduled';
    }

    // Toggle completion status with haptic/vibration feedback
    function toggleTake(id) {
      const item = supplements.find(s => s.id === id);
      if (item) {
        item.taken = !item.taken;

        // Gentle vibration feedback on mobile
        if (navigator.vibrate) {
          navigator.vibrate(item.taken ? [30, 20, 30] : 20);
        }

        if (item.taken) {
          showToast(`Marked ${item.name} as taken`);
        }

        saveData();
        renderSupplements();
        checkStreakProgress();
        renderCalendar();
      }
    }

    function updateProgress(todayScheduled) {
      if (todayScheduled.length === 0) {
        document.getElementById('progress-status-text').innerText = '0%';
        document.getElementById('progress-bar-fill').style.width = '0%';
        return;
      }

      const completed = todayScheduled.filter(s => s.taken).length;
      const percentage = Math.round((completed / todayScheduled.length) * 100);

      document.getElementById('progress-status-text').innerText = `${percentage}% Completed (${completed}/${todayScheduled.length})`;
      document.getElementById('progress-bar-fill').style.width = `${percentage}%`;
    }

    // Track Streak
    function checkStreakProgress() {
      const todayScheduled = supplements.filter(s => isScheduledForDate(s, new Date()));
      const allDone = todayScheduled.length > 0 && todayScheduled.every(s => s.taken);

      if (allDone) {
        showToast('🔥 Daily protocol complete! Streak active.');
      }
      updateStreakUI();
    }

    function updateStreakUI() {
      document.getElementById('streak-counter').innerText = `${streak} Day Streak`;
    }

    // Save history logging for calendar rendering
    function recordDayHistory(dateStr) {
      const targetDate = new Date(dateStr);
      const scheduledList = supplements.filter(s => isScheduledForDate(s, targetDate));
      
      if (scheduledList.length === 0) return;

      const completedList = scheduledList.filter(s => s.taken);

      historyData[dateStr] = {
        scheduled: scheduledList.length,
        completed: completedList.length,
        status: completedList.length === scheduledList.length ? 'green' : (completedList.length > 0 ? 'amber' : 'none')
      };

      saveData();
    }

    // Render Calendar & Stats View
    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      const monthYearTitle = document.getElementById('calendar-month-year');
      grid.innerHTML = '';

      const year = calendarViewDate.getFullYear();
      const month = calendarViewDate.getMonth();

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      monthYearTitle.innerText = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Empty lead slots
      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'h-9 rounded-xl';
        grid.appendChild(emptyCell);
      }

      const todayStr = getTodayISOString();

      // Fill calendar days
      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month, day);
        const dateStr = getISOString(dateObj);

        const dayCell = document.createElement('div');
        dayCell.className = 'h-9 rounded-xl flex items-center justify-center font-bold relative transition-all border border-transparent';

        const dayHist = historyData[dateStr];

        if (dayHist) {
          if (dayHist.status === 'green') {
            dayCell.className += ' bg-brand-500 text-slate-950 shadow-sm shadow-brand-500/30';
          } else if (dayHist.status === 'amber') {
            dayCell.className += ' bg-amber-500/20 text-amber-400 border-amber-500/40';
          } else {
            dayCell.className += ' bg-dark-surface text-slate-400 border-dark-border';
          }
        } else {
          dayCell.className += ' bg-dark-surface/40 text-slate-400 border-dark-border/40';
        }

        // Highlight Today
        if (dateStr === todayStr) {
          dayCell.className += ' ring-2 ring-white ring-offset-1 ring-offset-dark-bg';
        }

        dayCell.innerText = day;
        grid.appendChild(dayCell);
      }

      renderGlobalMetrics();
    }

    function changeCalendarMonth(offset) {
      calendarViewDate.setMonth(calendarViewDate.getMonth() + offset);
      renderCalendar();
    }

    function renderGlobalMetrics() {
      const historyEntries = Object.values(historyData);
      if (historyEntries.length === 0) {
        document.getElementById('stat-compliance').innerText = '100%';
        document.getElementById('stat-total-taken').innerText = '0';
        return;
      }

      let totalScheduled = 0;
      let totalCompleted = 0;

      historyEntries.forEach(entry => {
        totalScheduled += entry.scheduled || 0;
        totalCompleted += entry.completed || 0;
      });

      const compliancePct = totalScheduled > 0 ? Math.round((totalCompleted / totalScheduled) * 100) : 100;

      document.getElementById('stat-compliance').innerText = `${compliancePct}%`;
      document.getElementById('stat-streak').innerText = `${streak} Days`;
      document.getElementById('stat-total-taken').innerText = totalCompleted.toString();

      // Render Schedule Breakdown List
      const breakdownContainer = document.getElementById('schedule-breakdown');
      breakdownContainer.innerHTML = '';

      supplements.forEach(supp => {
        const item = document.createElement('div');
        item.className = 'pt-2 flex justify-between items-center text-slate-300';
        item.innerHTML = `
          <div>
            <span class="font-bold text-white block">${supp.name}</span>
            <span class="text-[10px] text-slate-400">${supp.dosage} • ${formatFrequencyText(supp.frequency)}</span>
          </div>
          <span class="text-[10px] px-2 py-1 bg-dark-surface rounded-lg text-brand-500 border border-dark-border">${supp.time || 'No Alert'}</span>
        `;
        breakdownContainer.appendChild(item);
      });
    }

    // Modal Control Logic
    function openModal(id = null) {
      const modal = document.getElementById('modal-backdrop');
      const title = document.getElementById('modal-title');

      if (id) {
        const item = supplements.find(s => s.id === id);
        if (item) {
          document.getElementById('supp-id').value = item.id;
          document.getElementById('supp-name').value = item.name;
          document.getElementById('supp-dosage').value = item.dosage;
          document.getElementById('supp-timing').value = item.timing;
          document.getElementById('supp-time').value = item.time || '08:00';
          document.getElementById('supp-notif-enabled').checked = item.notifEnabled || false;
          document.getElementById('supp-notes').value = item.notes || '';

          const freqType = item.frequency ? item.frequency.type : 'daily';
          document.getElementById('supp-freq-type').value = freqType;

          toggleFrequencyOptions();

          if (freqType === 'custom' && item.frequency.days) {
            item.frequency.days.forEach(d => {
              const el = document.getElementById(`day-${d}`);
              if (el) el.checked = true;
            });
          }

          title.innerHTML = '<i class="fa-solid fa-pen-to-square text-brand-500"></i> Edit Supplement';
        }
      } else {
        document.getElementById('supplement-form').reset();
        document.getElementById('supp-id').value = '';
        document.getElementById('supp-time').value = '08:00';
        document.getElementById('supp-notif-enabled').checked = true;
        document.getElementById('supp-freq-type').value = 'daily';
        toggleFrequencyOptions();
        title.innerHTML = '<i class="fa-solid fa-pills text-brand-500"></i> Add Supplement';
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function buildCustomDaysSelector() {
      const grid = document.getElementById('days-selector-grid');
      grid.innerHTML = '';

      DAYS_SHORT.forEach((dayName, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex-1 text-center';
        wrapper.innerHTML = `
          <input type="checkbox" id="day-${idx}" value="${idx}" class="day-btn-checkbox hidden">
          <label for="day-${idx}" class="block py-1 rounded-lg border border-dark-border text-[10px] text-slate-300 cursor-pointer text-center transition-all hover:border-slate-500">${dayName}</label>
        `;
        grid.appendChild(wrapper);
      });
    }

    function toggleFrequencyOptions() {
      const type = document.getElementById('supp-freq-type').value;
      const customContainer = document.getElementById('custom-days-container');

      if (type === 'custom') {
        customContainer.classList.remove('hidden');
      } else {
        customContainer.classList.add('hidden');
      }
    }

    // Save/Update Supplement
    function saveSupplement(e) {
      e.preventDefault();

      const id = document.getElementById('supp-id').value;
      const name = document.getElementById('supp-name').value.trim();
      const dosage = document.getElementById('supp-dosage').value.trim();
      const timing = document.getElementById('supp-timing').value;
      const time = document.getElementById('supp-time').value;
      const notifEnabled = document.getElementById('supp-notif-enabled').checked;
      const notes = document.getElementById('supp-notes').value.trim();

      const freqType = document.getElementById('supp-freq-type').value;
      let frequencyObj = { type: freqType };

      if (freqType === 'custom') {
        const selectedDays = [];
        for (let i = 0; i < 7; i++) {
          const el = document.getElementById(`day-${i}`);
          if (el && el.checked) selectedDays.push(i);
        }
        frequencyObj.days = selectedDays.length > 0 ? selectedDays : [0, 1, 2, 3, 4, 5, 6];
      }

      if (id) {
        const item = supplements.find(s => s.id === id);
        if (item) {
          item.name = name;
          item.dosage = dosage;
          item.timing = timing;
          item.time = time;
          item.notifEnabled = notifEnabled;
          item.notes = notes;
          item.frequency = frequencyObj;
          showToast('Supplement updated');
        }
      } else {
        const newSupp = {
          id: Date.now().toString(),
          name,
          dosage,
          timing,
          time,
          notifEnabled,
          notes,
          frequency: frequencyObj,
          createdDate: getTodayISOString(),
          taken: false
        };
        supplements.push(newSupp);
        showToast('New supplement created');
      }

      saveData();
      renderSupplements();
      renderCalendar();
      closeModal();
    }

    function deleteSupplement(id) {
      supplements = supplements.filter(s => s.id !== id);
      saveData();
      renderSupplements();
      renderCalendar();
      showToast('Supplement deleted');
    }

    // Navigation Tabs Switcher
    function switchTab(tabName) {
      const trackerMain = document.getElementById('view-tracker');
      const statsMain = document.getElementById('view-stats');
      const navTracker = document.getElementById('nav-tracker');
      const navStats = document.getElementById('nav-stats');

      if (tabName === 'tracker') {
        trackerMain.classList.remove('hidden');
        statsMain.classList.add('hidden');
        navTracker.className = 'flex flex-col items-center gap-1 text-brand-500 font-semibold transition-all';
        navStats.className = 'flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition-all';
      } else {
        trackerMain.classList.add('hidden');
        statsMain.classList.remove('hidden');
        navStats.className = 'flex flex-col items-center gap-1 text-brand-500 font-semibold transition-all';
        navTracker.className = 'flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition-all';
        renderCalendar();
      }
    }

    function filterSupplements(timing) {
      activeFilter = timing;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-4 py-2 rounded-full font-medium bg-dark-card text-slate-300 border border-dark-border hover:bg-dark-surface transition-all';
      });

      const activeTab = document.getElementById(`tab-${timing}`);
      if (activeTab) {
        activeTab.className = 'tab-btn px-4 py-2 rounded-full font-medium bg-brand-500 text-slate-950 shadow-sm transition-all';
      }

      renderSupplements();
    }

    function resetDailyCheck() {
      const todayScheduled = supplements.filter(s => isScheduledForDate(s, new Date()));
      todayScheduled.forEach(s => s.taken = false);
      saveData();
      renderSupplements();
      renderCalendar();
      showToast('Today checklist reset');
    }

    function clearAllData() {
      if (confirm('Are you sure you want to reset all data and history back to clean defaults?')) {
        localStorage.clear();
        supplements = DEFAULT_SUPPLEMENTS;
        historyData = {};
        streak = 0;
        saveData();
        renderSupplements();
        renderCalendar();
        updateStreakUI();
        showToast('App reset to clean defaults');
      }
    }

    // Notification Engine & Service Worker Integration
    function requestNotificationPermission() {
      if (!("Notification" in window)) {
        showToast("Notifications not supported in this browser");
        return;
      }

      Notification.requestPermission().then(permission => {
        updateNotificationStatusUI();
        if (permission === "granted") {
          showToast("Notification alerts enabled!");
          triggerLocalNotification("VitaTrack Reminders", "Alerts successfully enabled for scheduled pills.");
        } else {
          showToast("Notifications disabled");
        }
      });
    }

    function updateNotificationStatusUI() {
      const bell = document.getElementById('notif-bell-icon');
      const offIcon = document.getElementById('notif-off-icon');

      if ("Notification" in window && Notification.permission === "granted") {
        bell.className = "fa-solid fa-bell text-brand-500 text-sm";
        offIcon.classList.add('hidden');
      } else {
        bell.className = "fa-solid fa-bell-slash text-slate-500 text-sm";
        offIcon.classList.remove('hidden');
      }
    }

    function triggerLocalNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(title, {
              body: body,
              icon: 'icon-192.png',
              badge: 'icon-192.png',
              vibrate: [100, 50, 100]
            });
          });
        } else {
          new Notification(title, { body: body, icon: 'icon-192.png' });
        }
      }
    }

    // Interval Scheduler: checks every minute for scheduled supplement alarms
    function initNotificationTimer() {
      updateNotificationStatusUI();

      setInterval(() => {
        const now = new Date();
        const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        supplements.forEach(supp => {
          if (
            supp.notifEnabled && 
            !supp.taken && 
            supp.time === currentTimeStr && 
            isScheduledForDate(supp, now)
          ) {
            triggerLocalNotification(`Reminder: Take ${supp.name}`, `Dosage: ${supp.dosage} (${supp.timing})`);
          }
        });
      }, 60000); // Checks every 60s
    }

    // Register basic PWA Service Worker inline script
    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          // Silent fallback if offline or no SW script exists
        });
      }
    }

    // Toast UI helper
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');

      toastMsg.innerText = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
        toast.classList.remove('opacity-100');
      }, 2200);
    }
  </script>
</body>
</html>
