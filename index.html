<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VitaTrack - Supplement Manager</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <style>
    :root {
      --bg: #0a0a0a;
      --card-bg: #141416;
      --card-border: #222226;
      --accent-green: #00e676;
      --accent-green-glow: rgba(0, 230, 118, 0.25);
      --accent-amber: #ffb300;
      --text-main: #f0f0f5;
      --text-muted: #888899;
      --badge-locked: #1c1c20;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; padding-bottom: 80px; }

    header { padding: 24px 20px 16px; background: rgba(10,10,10,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.3rem; font-weight: 700; tracking: -0.5px; }
    
    .tab-nav { display: flex; background: #18181c; border-radius: 12px; padding: 4px; margin: 16px 20px 0; border: 1px solid var(--card-border); }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: var(--card-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

    .view { display: none; padding: 20px; }
    .view.active { display: block; }

    /* Checklist Item Cards */
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; transition: transform 0.1s, border-color 0.2s; }
    .card.completed { border-color: rgba(0, 230, 118, 0.3); background: #111a14; }
    .card-info h3 { font-size: 1rem; margin-bottom: 4px; }
    .card-info p { font-size: 0.8rem; color: var(--text-muted); }
    
    .checkbox { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--card-border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
    .card.completed .checkbox { background: var(--accent-green); border-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green-glow); }
    .checkbox::after { content: '✓'; color: #000; font-weight: bold; font-size: 16px; display: none; }
    .card.completed .checkbox::after { display: block; }

    /* Streaks & Badges Showcase */
    .streak-banner { background: linear-gradient(135deg, #122417 0%, #141416 100%); border: 1px solid rgba(0, 230, 118, 0.3); border-radius: 16px; padding: 20px; margin-bottom: 24px; text-align: center; position: relative; overflow: hidden; }
    .streak-count { font-size: 2.8rem; font-weight: 800; color: var(--accent-green); text-shadow: 0 0 16px var(--accent-green-glow); line-height: 1; margin: 8px 0; }
    .streak-subtitle { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    .badges-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .badge-card { background: var(--badge-locked); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; text-align: center; position: relative; transition: all 0.3s; opacity: 0.6; }
    .badge-card.unlocked { background: var(--card-bg); border-color: var(--accent-green); opacity: 1; box-shadow: 0 0 16px rgba(0,230,118,0.15); }
    .badge-icon { font-size: 2rem; margin-bottom: 8px; filter: grayscale(100%); }
    .badge-card.unlocked .badge-icon { filter: grayscale(0%); }
    .badge-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
    .badge-desc { font-size: 0.72rem; color: var(--text-muted); line-height: 1.3; }
    .progress-bar-bg { background: #222228; height: 4px; border-radius: 2px; margin-top: 10px; overflow: hidden; }
    .progress-bar-fill { background: var(--accent-green); height: 100%; width: 0%; transition: width 0.4s ease; }

    /* Calendar Grid */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .day-name { font-size: 0.75rem; color: var(--text-muted); padding-bottom: 8px; font-weight: 600; }
    .day-cell { aspect-ratio: 1; border-radius: 8px; background: #18181c; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; border: 1px solid transparent; }
    .day-cell.green { background: rgba(0, 230, 118, 0.15); border-color: var(--accent-green); color: var(--accent-green); }
    .day-cell.amber { background: rgba(255, 179, 0, 0.15); border-color: var(--accent-amber); color: var(--accent-amber); }
    .day-cell.today { border: 1px solid #ffffff; }

    /* Add Form & Inputs */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; background: #18181c; border: 1px solid var(--card-border); border-radius: 10px; color: var(--text-main); font-size: 0.95rem; outline: none; }
    input:focus, select:focus { border-color: var(--accent-green); }
    .btn { width: 100%; padding: 14px; background: var(--accent-green); color: #000; font-weight: 700; border: none; border-radius: 12px; font-size: 0.95rem; cursor: pointer; }

    /* Bottom Nav Bar */
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,10,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 10px 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600; gap: 4px; cursor: pointer; }
    .nav-item.active { color: var(--accent-green); }
    .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
  </style>
</head>
<body>

  <header>
    <h1>VitaTrack</h1>
    <span id="date-display" style="font-size:0.8rem; color:var(--text-muted);"></span>
  </header>

  <!-- Navigation Views -->
  <main>
    <!-- Checklist Tab -->
    <section id="checklist-view" class="view active">
      <div id="supplement-list"></div>
    </section>

    <!-- Stats & Streaks Tab -->
    <section id="stats-view" class="view">
      <div class="streak-banner">
        <div class="streak-subtitle">Active Adherence Streak</div>
        <div class="streak-count" id="current-streak">0 DAYS</div>
        <div style="font-size:0.8rem; color:var(--text-muted);" id="best-streak">Personal Best: 0 Days</div>
      </div>

      <!-- Calendar View -->
      <div class="calendar-header">
        <h3 style="font-size: 1rem;">Monthly Adherence</h3>
        <span id="month-name" style="font-size: 0.85rem; color: var(--text-muted);"></span>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>

      <!-- Streaks & Badges Showcase Section -->
      <h3 style="font-size: 1rem; margin-top: 28px; margin-bottom: 12px;">Milestone Badges</h3>
      <div class="badges-grid" id="badges-grid"></div>
    </section>

    <!-- Manage Supplements Tab -->
    <section id="manage-view" class="view">
      <h3 style="margin-bottom: 16px;">Add New Supplement</h3>
      <form id="add-form">
        <div class="form-group">
          <label>Supplement Name</label>
          <input type="text" id="supp-name" placeholder="e.g. Creatine Monohydrate" required>
        </div>
        <div class="form-group">
          <label>Frequency</label>
          <select id="supp-freq">
            <option value="daily">Daily</option>
            <option value="alternate">Alternate Days (Every 48 hrs)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Daily Reminder Time</label>
          <input type="time" id="supp-time" value="08:00">
        </div>
        <button type="submit" class="btn">Add to Schedule</button>
      </form>
    </section>
  </main>

  <!-- Fixed Bottom Navigation -->
  <nav class="nav-bar">
    <div class="nav-item active" onclick="switchTab('checklist-view', this)">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      Today
    </div>
    <div class="nav-item" onclick="switchTab('stats-view', this)">
      <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
      Stats
    </div>
    <div class="nav-item" onclick="switchTab('manage-view', this)">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Add
    </div>
  </nav>

  <script>
    // State & Storage
    let supplements = JSON.parse(localStorage.getItem('vt_supplements')) || [
      { id: 1, name: 'Creatine Monohydrate', freq: 'daily', time: '08:00' },
      { id: 2, name: 'Omega-3 Fish Oil', freq: 'daily', time: '12:00' },
      { id: 3, name: 'Magnesium Glycinate', freq: 'daily', time: '22:00' }
    ];

    let logs = JSON.parse(localStorage.getItem('vt_logs')) || {};
    const todayKey = new Date().toISOString().split('T')[0];

    // Defined Milestone Badges
    const BADGES = [
      { id: 'streak-1', icon: '⚡', title: 'First Intake', target: 1, desc: 'Complete 1 full day of scheduled supplements.' },
      { id: 'streak-7', icon: '🛡️', title: '7-Day Vanguard', target: 7, desc: 'Maintain 7 consecutive days of 100% adherence.' },
      { id: 'streak-14', icon: '🌿', title: 'Fortified System', target: 14, desc: 'Reach 14 unbroken days of daily intake.' },
      { id: 'streak-30', icon: '💎', title: 'Monthly Titan', target: 30, desc: 'Complete 30 days of continuous adherence.' },
      { id: 'streak-90', icon: '👑', title: 'Master Alchemist', target: 90, desc: 'Reach 90 days of complete consistency.' }
    ];

    function init() {
      document.getElementById('date-display').innerText = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
      renderChecklist();
      renderStats();
      requestNotificationPermission();
    }

    function switchTab(viewId, element) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      element.classList.add('active');
      if (viewId === 'stats-view') renderStats();
    }

    function renderChecklist() {
      const container = document.getElementById('supplement-list');
      container.innerHTML = '';

      if (!logs[todayKey]) logs[todayKey] = {};

      supplements.forEach(supp => {
        const isDone = logs[todayKey][supp.id] || false;
        const card = document.createElement('div');
        card.className = `card ${isDone ? 'completed' : ''}`;
        card.innerHTML = `
          <div class="card-info">
            <h3>${supp.name}</h3>
            <p>${supp.freq === 'daily' ? 'Daily' : 'Alternate Days'} • Scheduled ${supp.time}</p>
          </div>
          <div class="checkbox" onclick="toggleSupp(${supp.id})"></div>
        `;
        container.appendChild(card);
      });

      saveLogs();
    }

    function toggleSupp(id) {
      if (!logs[todayKey]) logs[todayKey] = {};
      logs[todayKey][id] = !logs[todayKey][id];
      saveLogs();
      renderChecklist();
    }

    function saveLogs() {
      localStorage.setItem('vt_logs', JSON.stringify(logs));
      localStorage.setItem('vt_supplements', JSON.stringify(supplements));
    }

    // Calculate Streaks & Badges
    function calculateStreaks() {
      let currentStreak = 0;
      let date = new Date();

      while (true) {
        const dateStr = date.toISOString().split('T')[0];
        const dayLog = logs[dateStr];

        if (dayLog && supplements.every(s => dayLog[s.id])) {
          currentStreak++;
          date.setDate(date.getDate() - 1);
        } else {
          // If today isn't fully checked yet, look back starting yesterday before breaking
          if (dateStr === todayKey) {
            date.setDate(date.getDate() - 1);
            continue;
          }
          break;
        }
      }

      let bestStreak = Math.max(currentStreak, parseInt(localStorage.getItem('vt_best_streak') || '0'));
      localStorage.setItem('vt_best_streak', bestStreak);

      return { currentStreak, bestStreak };
    }

    function renderStats() {
      const { currentStreak, bestStreak } = calculateStreaks();
      document.getElementById('current-streak').innerText = `${currentStreak} DAYS`;
      document.getElementById('best-streak').innerText = `Personal Best: ${bestStreak} Days`;

      // Render Calendar
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      const now = new Date();
      document.getElementById('month-name').innerText = now.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      for (let day = 1; day <= daysInMonth; day++) {
        const cellDate = new Date(now.getFullYear(), now.getMonth(), day).toISOString().split('T')[0];
        const dayLog = logs[cellDate];
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.innerText = day;

        if (cellDate === todayKey) cell.classList.add('today');

        if (dayLog) {
          const completedCount = supplements.filter(s => dayLog[s.id]).length;
          if (completedCount === supplements.length && supplements.length > 0) {
            cell.classList.add('green');
          } else if (completedCount > 0) {
            cell.classList.add('amber');
          }
        }
        grid.appendChild(cell);
      }

      // Render Badges
      const badgesGrid = document.getElementById('badges-grid');
      badgesGrid.innerHTML = '';

      BADGES.forEach(badge => {
        const isUnlocked = currentStreak >= badge.target;
        const progressPct = Math.min(100, Math.round((currentStreak / badge.target) * 100));

        const card = document.createElement('div');
        card.className = `badge-card ${isUnlocked ? 'unlocked' : ''}`;
        card.innerHTML = `
          <div class="badge-icon">${badge.icon}</div>
          <div class="badge-title">${badge.title}</div>
          <div class="badge-desc">${badge.desc}</div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${progressPct}%;"></div>
          </div>
        `;
        badgesGrid.appendChild(card);
      });
    }

    // Add Supplement Event
    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const newSupp = {
        id: Date.now(),
        name: document.getElementById('supp-name').value,
        freq: document.getElementById('supp-freq').value,
        time: document.getElementById('supp-time').value
      };
      supplements.push(newSupp);
      saveLogs();
      e.target.reset();
      alert('Supplement added!');
    });

    // Notification Permission
    function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission !== 'granted') {
        Notification.requestPermission();
      }
    }

    init();
  </script>
</body>
</html>
