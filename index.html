<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Supplement Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0f17">
  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: #151c28;
      --card-border: #202b3c;
      --accent-green: #00e676;
      --accent-green-glow: rgba(0, 230, 118, 0.25);
      --accent-amber: #ffb300;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --danger: #ff5252;
      --modal-bg: #111722;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; padding-bottom: 90px; }

    /* Header & Progress Ring */
    header { padding: 18px 20px 10px; background: rgba(11,15,23,0.85); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
    .header-icons { display: flex; gap: 10px; align-items: center; }
    .streak-badge { background: #1c2636; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; color: var(--accent-amber); display: flex; align-items: center; gap: 4px; }

    .ring-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 10px 0 24px; position: relative; }
    .progress-ring { transform: rotate(-90deg); }
    .ring-text { position: absolute; text-align: center; }
    .ring-text .count { font-size: 1.4rem; font-weight: 800; display: block; }
    .ring-text .sub { font-size: 0.8rem; color: var(--text-muted); }

    .view { display: none; padding: 0 20px; }
    .view.active { display: block; }

    .section-label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); letter-spacing: 1px; margin: 20px 0 10px; text-transform: uppercase; }

    /* Card Layout */
    .supp-card { background: var(--card-bg); border-radius: 16px 16px 0 0; padding: 16px; border: 1px solid var(--card-border); border-bottom: none; }
    .card-main { display: flex; align-items: center; gap: 14px; }
    .pill-icon { font-size: 1.8rem; }
    .card-details { flex: 1; }
    .card-details h3 { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
    .card-details .dose { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    .card-details .sub-info { font-size: 0.78rem; color: var(--text-muted); }

    .check-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--card-border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; background: #1a2332; font-weight: bold; }
    .check-btn.checked { background: var(--accent-green); border-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green-glow); color: #000; }

    .doses-bar { background: #121824; border-radius: 0 0 16px 16px; border: 1px solid var(--card-border); border-top: 1px solid rgba(255,255,255,0.05); padding: 12px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; }
    .doses-click { color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 4px; font-weight: 500; }
    .log-another { color: var(--accent-green); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }

    /* Bottom Sheet Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--modal-bg); border-radius: 24px 24px 0 0; padding: 24px 20px 30px; z-index: 101; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); border-top: 1px solid var(--card-border); max-height: 80vh; overflow-y: auto; }
    .modal-overlay.active .bottom-sheet { transform: translateY(0); }

    .sheet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .sheet-title { display: flex; align-items: center; gap: 12px; }
    .sheet-title h2 { font-size: 1.2rem; font-weight: 800; }
    .sheet-title p { font-size: 0.8rem; color: var(--text-muted); }
    .close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; padding: 4px; }

    .dose-item { background: #17202e; border: 1px solid var(--card-border); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .dose-item-info h4 { font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; }
    .dose-item-info p { font-size: 0.8rem; color: var(--text-muted); }
    .trash-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: 6px; }

    .modal-action-btn { width: 100%; padding: 14px; background: transparent; border: 1.5px solid var(--accent-green); color: var(--accent-green); font-weight: 700; border-radius: 12px; font-size: 0.9rem; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }

    /* Calendar Grid */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; margin-top: 16px; }
    .day-cell { aspect-ratio: 1; border-radius: 8px; background: #17202e; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; border: 1px solid transparent; }
    .day-cell.green { background: rgba(0, 230, 118, 0.15); border-color: var(--accent-green); color: var(--accent-green); }
    .day-cell.amber { background: rgba(255, 179, 0, 0.15); border-color: var(--accent-amber); color: var(--accent-amber); }

    /* Bottom Nav Bar */
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(11,15,23,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 20; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600; gap: 4px; cursor: pointer; }
    .nav-item.active { color: var(--accent-green); }
    .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
  </style>
</head>
<body>

  <header>
    <h1>Today</h1>
    <div class="header-icons">
      <div class="streak-badge">🔥 <span id="streak-count">3</span></div>
    </div>
  </header>

  <main>
    <!-- TAB 1: Today View -->
    <section id="today-view" class="view active">
      <div class="ring-container">
        <svg class="progress-ring" width="120" height="120">
          <circle stroke="#1c2636" stroke-width="10" fill="transparent" r="50" cx="60" cy="60"/>
          <circle id="ring-circle" stroke="#00e676" stroke-width="10" stroke-linecap="round" fill="transparent" r="50" cx="60" cy="60" stroke-dasharray="314" stroke-dashoffset="62"/>
        </svg>
        <div class="ring-text">
          <span class="count" id="taken-count">0 of 0</span>
          <span class="sub">taken</span>
        </div>
      </div>

      <div class="section-label">Morning</div>
      <div id="morning-list"></div>

      <div class="section-label">Evening</div>
      <div id="evening-list"></div>
    </section>

    <!-- TAB 2: Supplements -->
    <section id="supplements-view" class="view">
      <h2 style="margin: 16px 0 12px;">My Supplements</h2>
      <div id="full-supp-list"></div>
    </section>

    <!-- TAB 3: Log (Calendar) -->
    <section id="log-view" class="view">
      <h2 style="margin: 16px 0 12px;">Adherence History</h2>
      <div class="calendar-grid" id="calendar-grid"></div>
    </section>

    <!-- TAB 4: Stats -->
    <section id="stats-view" class="view">
      <h2 style="margin: 16px 0 12px;">Milestone Badges</h2>
      <div id="badges-container"></div>
    </section>
  </main>

  <!-- Dose History Modal -->
  <div class="modal-overlay" id="dose-modal" onclick="closeDoseModal(event)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <div class="sheet-title">
          <span class="pill-icon" id="modal-pill-icon">💊</span>
          <div>
            <h2 id="modal-supp-title">Fish Oil</h2>
            <p>Today's log</p>
          </div>
        </div>
        <button class="close-btn" onclick="closeDoseModal()">✕</button>
      </div>

      <div id="modal-doses-list"></div>

      <button class="modal-action-btn" onclick="addDoseFromModal()">
        ⊕ Log another dose
      </button>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="nav-bar">
    <div class="nav-item active" onclick="switchTab('today-view', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      Today
    </div>
    <div class="nav-item" onclick="switchTab('supplements-view', this)">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      Supplements
    </div>
    <div class="nav-item" onclick="switchTab('log-view', this)">
      <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
      Log
    </div>
    <div class="nav-item" onclick="switchTab('stats-view', this)">
      <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
      Stats
    </div>
  </nav>

  <script>
    // Force unregister any old cached Service Workers to ensure fresh loads
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    let supplements = JSON.parse(localStorage.getItem('vt_supplements')) || [
      { id: 1, name: 'Vitamin D & K2 MK-7', dose: '4000iu & M2 100µg', time: '11:00', freq: 'Every other day', slot: 'morning', icon: '💊' },
      { id: 2, name: 'Fish Oil', dose: '660mg EPA & 440mg DHA', time: '12:00', freq: 'Daily', slot: 'morning', icon: '🥜' },
      { id: 3, name: 'Vitamin C + Zinc', dose: '1000mg Vitamin C + 15mg Zinc', time: '10:00', freq: 'Daily', slot: 'morning', icon: '🛡️' }
    ];

    let doseLogs = JSON.parse(localStorage.getItem('vt_dose_logs')) || {};
    const todayKey = new Date().toISOString().split('T')[0];
    let activeModalSuppId = null;

    function init() {
      if (!doseLogs[todayKey]) doseLogs[todayKey] = {};
      renderToday();
    }

    function switchTab(viewId, el) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      el.classList.add('active');
      if (viewId === 'log-view') renderCalendar();
    }

    function renderToday() {
      const morningContainer = document.getElementById('morning-list');
      const eveningContainer = document.getElementById('evening-list');
      morningContainer.innerHTML = '';
      eveningContainer.innerHTML = '';

      let totalTaken = 0;

      supplements.forEach(supp => {
        const suppLogs = (doseLogs[todayKey] && doseLogs[todayKey][supp.id]) || [];
        const isTaken = suppLogs.length > 0;
        if (isTaken) totalTaken++;

        const cardHTML = `
          <div>
            <div class="supp-card">
              <div class="card-main">
                <span class="pill-icon">${supp.icon || '💊'}</span>
                <div class="card-details">
                  <h3>${supp.name}</h3>
                  <div class="dose">${supp.dose}</div>
                  <div class="sub-info">🕒 ${supp.time} • ${supp.freq}</div>
                </div>
                <div class="check-btn ${isTaken ? 'checked' : ''}" onclick="toggleQuickDose(${supp.id})">
                  ${isTaken ? '✓' : ''}
                </div>
              </div>
            </div>
            <div class="doses-bar">
              <div class="doses-click" onclick="openDoseModal(${supp.id})">
                Doses today: ${suppLogs.length} ›
              </div>
              <div class="log-another" onclick="addDoseDirect(${supp.id})">
                ⊕ Log another dose
              </div>
            </div>
          </div>
        `;

        if (supp.slot === 'evening') {
          eveningContainer.innerHTML += cardHTML;
        } else {
          morningContainer.innerHTML += cardHTML;
        }
      });

      // Update Circular Ring
      document.getElementById('taken-count').innerText = `${totalTaken} of ${supplements.length}`;
      const circle = document.getElementById('ring-circle');
      const offset = 314 - (314 * (totalTaken / (supplements.length || 1)));
      circle.style.strokeDashoffset = offset;
    }

    function toggleQuickDose(id) {
      if (!doseLogs[todayKey][id]) doseLogs[todayKey][id] = [];
      if (doseLogs[todayKey][id].length === 0) {
        const now = new Date();
        doseLogs[todayKey][id].push({
          slot: now.getHours() < 12 ? 'Morning' : 'Evening',
          time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
      } else {
        doseLogs[todayKey][id] = [];
      }
      saveLogs();
      renderToday();
    }

    function addDoseDirect(id) {
      if (!doseLogs[todayKey][id]) doseLogs[todayKey][id] = [];
      const now = new Date();
      doseLogs[todayKey][id].push({
        slot: now.getHours() < 12 ? 'Morning' : 'Evening',
        time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      saveLogs();
      renderToday();
    }

    /* Modal Sheet Logic */
    function openDoseModal(suppId) {
      activeModalSuppId = suppId;
      const supp = supplements.find(s => s.id === suppId);
      if (!supp) return;

      document.getElementById('modal-pill-icon').innerText = supp.icon || '💊';
      document.getElementById('modal-supp-title').innerText = supp.name;

      renderModalDosesList();
      document.getElementById('dose-modal').classList.add('active');
    }

    function renderModalDosesList() {
      const container = document.getElementById('modal-doses-list');
      container.innerHTML = '';
      const logs = (doseLogs[todayKey] && doseLogs[todayKey][activeModalSuppId]) || [];

      if (logs.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px 0;">No doses logged today.</div>`;
        return;
      }

      logs.forEach((item, index) => {
        container.innerHTML += `
          <div class="dose-item">
            <div class="dose-item-info">
              <h4>${item.slot}</h4>
              <p>${item.time}</p>
            </div>
            <button class="trash-btn" onclick="deleteDoseItem(${index})">🗑️</button>
          </div>
        `;
      });
    }

    function deleteDoseItem(index) {
      if (doseLogs[todayKey] && doseLogs[todayKey][activeModalSuppId]) {
        doseLogs[todayKey][activeModalSuppId].splice(index, 1);
        saveLogs();
        renderModalDosesList();
        renderToday();
      }
    }

    function addDoseFromModal() {
      addDoseDirect(activeModalSuppId);
      renderModalDosesList();
    }

    function closeDoseModal(e) {
      if (!e || e.target.id === 'dose-modal' || e.target.classList.contains('close-btn')) {
        document.getElementById('dose-modal').classList.remove('active');
      }
    }

    function saveLogs() {
      localStorage.setItem('vt_dose_logs', JSON.stringify(doseLogs));
      localStorage.setItem('vt_supplements', JSON.stringify(supplements));
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      for (let day = 1; day <= 31; day++) {
        const cell = document.createElement('div');
        cell.className = `day-cell ${day % 3 === 0 ? 'amber' : 'green'}`;
        cell.innerText = day;
        grid.appendChild(cell);
      }
    }

    init();
  </script>
</body>
</html>
